<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>O Impostor — um jogo social</title>
<meta name="description" content="Um jogo social local — passe o celular, descubra sua palavra, encontre o impostor." />
<meta name="theme-color" content="#0b0b0a" />
<meta name="color-scheme" content="dark light" />
<script>
  // Apply saved theme before paint to avoid FOUC.
  (function () {
    try {
      var saved = localStorage.getItem("theme");
      if (saved !== "light" && saved !== "dark") saved = "dark";
      document.documentElement.setAttribute("data-theme", saved);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", saved === "light" ? "#f5f0e6" : "#0b0b0a");
    } catch (_) {}
  })();
</script>

<!-- PWA -->
<link rel="icon" type="image/svg+xml" href="/icon.svg" />
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

<!-- iOS standalone behavior -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="O Impostor" />

<!-- Open Graph -->
<meta property="og:title" content="O Impostor — um jogo social" />
<meta property="og:description" content="Passe o celular, descubra sua palavra, encontre o impostor." />

<meta property="og:locale" content="pt_BR" />
